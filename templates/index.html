<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Emotion Recognition</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 60px auto; text-align: center; color: #222; }
    h1 { font-size: 1.6rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px; margin-top: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    input[type=file] { margin: 16px 0; }
    button { background: #4a5aef; color: white; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #3745c9; }
    .result { font-size: 1.4rem; font-weight: bold; margin-top: 10px; color: #2e7d32; }
    .error { color: #c62828; margin-top: 10px; }
    table { width: 100%; margin-top: 16px; border-collapse: collapse; }
    td { padding: 6px 4px; text-align: left; border-bottom: 1px solid #eee; }
    .bar { background: #4a5aef; height: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🎙️ Speech Emotion Recognition</h1>
  <div class="card">
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="audio_file" accept=".wav" required>
      <br>
      <button type="submit">Analyze Emotion</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if result %}
      <p>Detected emotion:</p>
      <p class="result">{{ result | upper }}</p>
      <table>
        {% for emo, p in probs.items() %}
        <tr>
          <td>{{ emo }}</td>
          <td>
            <div class="bar" style="width: {{ (p*100)|round(1) }}%;"></div>
          </td>
          <td>{{ (p*100)|round(1) }}%</td>
        </tr>
        {% endfor %}
      </table>
    {% endif %}
  </div>
</body>
</html>
